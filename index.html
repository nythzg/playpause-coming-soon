<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <div class="page-shell">
    <header class="masthead">
      <img class="wordmark" src="assets/playpause-wordmark-night.svg" alt="PlayPause" width="2400" height="458">
    </header>
    <main id="main">
      <div class="brand-stage" aria-hidden="true">
        <div class="orbit orbit-back"></div>
        <div class="orbit orbit-front"></div>

          <div class="signal-rim"></div>

          <img class="brand-mark" src="assets/playpause-mark-night.svg" alt="" width="708" height="458" fetchpriority="high">

      </div>
      <div class="announcement">
        <h1>Coming <span>soon.</span></h1>
        <p class="motto">Where every player has a story.</p>
      </div>

        <li>Game top-ups</li><li>MLBB accounts</li><li>Store gift cards</li>
      </ul>
    </main>

      <span class="copyright">© 2026 PlayPause</span>
      <a class="contact" href="mailto:admin@playpause.in">Get in touch <span aria-hidden="true">↗</span></a>
      <button class="motion-toggle" type="button" aria-label="Pause animation" aria-pressed="false" title="Pause animation" hidden>
        <svg class="pause-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7 5v10M13 5v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="play-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 9 6-9 6z" fill="currentColor"/></svg>
      </button>
    </footer>

  <script src="app.js?v=3" defer></script>
